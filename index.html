        <div className="space-y-2.5 pt-1">
          {data.map((item, idx) => {
            const val = Number(item[valueKey]) || 0;
            const pct = Math.min(100, (val / maxVal) * 100);
            return (
              <div key={idx} className="space-y-1">
                <div className="flex justify-between text-xs font-semibold text-slate-300">
                  <span className="truncate pr-2">{item[keyKey]}</span>

                  <div 
                    style={{ width: `${pct}%` }}

      const [newService, setNewService] = useState({ name: '', price: '', type: 'servicio', itemType: 'calzado', category: 'Limpieza', duration: '24-48h', description: '' });
      const [newBranch, setNewBranch] = useState({ name: '', address: '', phone: '', manager: '' });
      const [newUser, setNewUser] = useState({ email: '', name: '', role: 'cashier', branchId: 'b1' });
      const [newPromo, setNewPromo] = useState({ code: '', percent: '', description: '' });
      const [newConvenio, setNewConvenio] = useState({ name: '', discountPercent: '', contact: '' });
      const [loginEmailInput, setLoginEmailInput] = useState('');

      // Filtered Orders & Calculations
      const filteredOrdersByTimeframe = useMemo(() => {
        const todayStr = new Date().toISOString().split('T')[0];
        const now = new Date();

        return orders.filter(order => {
          if (selectedBranchId !== 'all' && order.branchId !== selectedBranchId) return false;
          const cust = customers.find(c => c.id === order.customerId);
          const custChannel = cust ? cust.channel : 'Local / Transeúnte';
          if (!selectedChannels.includes(custChannel)) return false;

          const orderDate = new Date(order.date);
          if (reportTimeframe === 'day') return order.date === todayStr;
          if (reportTimeframe === 'week') {
            const diffDays = Math.ceil(Math.abs(now - orderDate) / (1000 * 60 * 60 * 24));
            return diffDays <= 7;
          }
          if (reportTimeframe === 'month') return orderDate.getMonth() === now.getMonth() && orderDate.getFullYear() === now.getFullYear();
          if (reportTimeframe === 'year') return orderDate.getFullYear() === now.getFullYear();
          return true;
        });
      }, [orders, reportTimeframe, selectedBranchId, selectedChannels, customers]);

      const filteredExpensesByTimeframe = useMemo(() => {
        const todayStr = new Date().toISOString().split('T')[0];
        const now = new Date();

        return expenses.filter(exp => {
          if (selectedBranchId !== 'all' && exp.branchId !== selectedBranchId) return false;
          const expDate = new Date(exp.date);
          if (reportTimeframe === 'day') return exp.date === todayStr;
          if (reportTimeframe === 'week') {
            const diffDays = Math.ceil(Math.abs(now - expDate) / (1000 * 60 * 60 * 24));
            return diffDays <= 7;
          }
          if (reportTimeframe === 'month') return expDate.getMonth() === now.getMonth() && expDate.getFullYear() === now.getFullYear();
          if (reportTimeframe === 'year') return expDate.getFullYear() === now.getFullYear();
          return true;
        });
      }, [expenses, reportTimeframe, selectedBranchId]);

      // Metrics Computation
      const financialMetrics = useMemo(() => {
        let totalRevenue = 0, cashTotal = 0, cardTotal = 0, transferTotal = 0;
        let itemTotals = { calzado: 0, gorras: 0, equipaje: 0, prendas: 0 };
        let serviceUsageMap = {};

        filteredOrdersByTimeframe.forEach(ord => {
          const amt = Number(ord.total) || 0;
          totalRevenue += amt;
          if (ord.paymentMethod === 'efectivo') cashTotal += amt;
          else if (ord.paymentMethod === 'tarjeta') cardTotal += amt;
          else if (ord.paymentMethod === 'transferencia') transferTotal += amt;

          if (ord.itemCounts) {
            itemTotals.calzado += (ord.itemCounts.calzado || 0);
            itemTotals.gorras += (ord.itemCounts.gorras || 0);
            itemTotals.equipaje += (ord.itemCounts.equipaje || 0);
            itemTotals.prendas += (ord.itemCounts.prendas || 0);
          }

          if (ord.items) {
            ord.items.forEach(item => {
              serviceUsageMap[item.name] = (serviceUsageMap[item.name] || 0) + (item.qty || 1);
            });
          }
        });

        const totalExpenses = filteredExpensesByTimeframe.reduce((sum, exp) => sum + (Number(exp.amount) || 0), 0);
        const netProfit = totalRevenue - totalExpenses;
        const profitMargin = totalRevenue > 0 ? ((netProfit / totalRevenue) * 100).toFixed(1) : 0;

        // Find top service
        let topServiceName = "N/A";
        let topServiceCount = 0;
        Object.keys(serviceUsageMap).forEach(sName => {
          if (serviceUsageMap[sName] > topServiceCount) {
            topServiceCount = serviceUsageMap[sName];
            topServiceName = sName;
          }
        });

        // Channel acquisition count
        let channelCountMap = {};
        customers.forEach(c => {
          channelCountMap[c.channel] = (channelCountMap[c.channel] || 0) + 1;
        });

        return { 
          totalRevenue, cashTotal, cardTotal, transferTotal, totalExpenses, 
          netProfit, profitMargin, itemTotals, topServiceName, topServiceCount,
          serviceUsageMap, channelCountMap
        };
      }, [filteredOrdersByTimeframe, filteredExpensesByTimeframe, customers]);

      // POS Handlers
      const handleAddPosItem = (service) => {
        setPosItems(prev => {
          const exists = prev.find(i => i.serviceId === service.id);
          if (exists) {
            return prev.map(i => i.serviceId === service.id ? { ...i, qty: i.qty + 1 } : i);
          }
          return [...prev, { serviceId: service.id, name: service.name, price: service.price, qty: 1, itemType: service.itemType || 'calzado' }];
        });
      };

      const handleRemovePosItem = (serviceId) => {
        setPosItems(prev => prev.filter(i => i.serviceId !== serviceId));
      };

      const handleUpdateItemQty = (serviceId, qty) => {
        if (qty <= 0) {
          handleRemovePosItem(serviceId);
          return;
        }
        setPosItems(prev => prev.map(i => i.serviceId === serviceId ? { ...i, qty } : i));
      };

      const posSubtotal = useMemo(() => posItems.reduce((sum, i) => sum + (i.price * i.qty), 0), [posItems]);

      // Calculate total discount combining manual discount, promo codes & convenios
      const computedDiscount = useMemo(() => {
        let disc = Number(posDiscount) || 0;
        if (posPromoCode) {
          const promo = discountCodes.find(d => d.code.toUpperCase() === posPromoCode.trim().toUpperCase());
          if (promo) disc += (posSubtotal * (promo.percent / 100));
        }
        if (posSelectedConvenioId) {
          const conv = convenios.find(c => c.id === posSelectedConvenioId);
          if (conv) disc += (posSubtotal * (conv.discountPercent / 100));
        }
        return Math.min(posSubtotal, disc);
      }, [posSubtotal, posDiscount, posPromoCode, posSelectedConvenioId, discountCodes, convenios]);

      const posTotal = useMemo(() => Math.max(0, posSubtotal - computedDiscount), [posSubtotal, computedDiscount]);

      const handleShoePhotoUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => setPosShoePhoto(reader.result);
          reader.readAsDataURL(file);
        }
      };

      const handleCreateOrder = (e) => {
        e.preventDefault();
        if (!posSelectedCustomer) {
          showToast('⚠️ Selecciona o agrega un cliente primero.', 'warning');
          return;
        }
        if (posItems.length === 0) {
          showToast('⚠️ Agrega al menos un servicio o producto al recibo.', 'warning');
          return;
        }

        const ticketNo = `FW-${new Date().getFullYear()}-${String(orders.length + 1).padStart(3, '0')}`;
        const newOrd = {
          id: `ord-${Date.now()}`,
          ticketNo,
          customerId: posSelectedCustomer.id,
          customerName: posSelectedCustomer.name,
          customerPhone: posSelectedCustomer.phone,
          branchId: posBranchId,
          date: new Date().toISOString().split('T')[0],
          deliveryDate: posDeliveryDate,
          paymentMethod: posPaymentMethod,
          status: 'en_proceso',
          items: posItems,
          itemCounts: { ...posItemCounts },
          shoeNotes: posShoeNotes,
          shoePhoto: posShoePhoto,
          discount: computedDiscount,
          appliedPromo: posPromoCode || (posSelectedConvenioId ? 'Convenio' : 'N/A'),
          total: posTotal,
          paidAmount: Number(posPaidAmount) || posTotal,
          clauses: ticketClauses,
          printedCount: 0
        };

        setOrders([newOrd, ...orders]);
        setActiveTicket(newOrd);

        setPosItems([]);
        setPosDiscount(0);
        setPosPromoCode('');
        setPosSelectedConvenioId('');
        setPosShoeNotes('');
        setPosShoePhoto('');
        setPosPaidAmount(0);

        showToast(`✅ Recibo ${ticketNo} guardado con éxito!`, 'success');
      };

      const handlePrintThermalTicket = (ticketToPrint) => {
        if (!ticketToPrint) return;

        if (currentUser.role === 'cashier' && ticketToPrint.printedCount >= 1) {
          showToast('🔒 ACCESO RESTRINGIDO: Este recibo ya fue impreso 1 vez. Solo el Administrador puede reimprimir.', 'error');
          return;
        }

        const updatedOrders = orders.map(o => o.id === ticketToPrint.id ? { ...o, printedCount: (o.printedCount || 0) + 1 } : o);
        setOrders(updatedOrders);

        if (activeTicket && activeTicket.id === ticketToPrint.id) {
          setActiveTicket({ ...activeTicket, printedCount: (activeTicket.printedCount || 0) + 1 });
        }

        window.print();
      };

      const handleGenerateTicketImage = async (ticketToCapture) => {
        const targetTicket = ticketToCapture || activeTicket || orders[0];
        if (!targetTicket) {
          showToast('⚠️ No hay ningún recibo activo para capturar.', 'warning');
          return;
        }
        setIsGeneratingImage(true);
        try {
          const element = document.getElementById('digital-photo-ticket-card');
          if (!element) {
            showToast('⚠️ No se encontró el área del ticket digital.', 'warning');
            setIsGeneratingImage(false);
            return;
          }

          const canvas = await window.html2canvas(element, { scale: 3, backgroundColor: '#080214', useCORS: true, logging: false });
          const imageUrl = canvas.toDataURL('image/png');

          canvas.toBlob((blob) => {
            setTicketImageModal({ imageUrl, blob, ticket: targetTicket });
            setIsGeneratingImage(false);
            showToast('📷 Foto del ticket generada con éxito!', 'success');
          }, 'image/png');

        } catch (err) {
          console.error(err);
          showToast('❌ Error al generar la foto del ticket.', 'error');
          setIsGeneratingImage(false);
        }
      };

      const handleOpenWhatsAppChat = (ticket) => {
        const target = ticket || activeTicket || orders[0];
        if (!target) return;

        const itemsText = target.items.map(i => `• ${i.name} (x${i.qty})`).join('\n');
        const text = `✨ *FOREVER WHITE.MX - RECIBO OFICIAL DE SERVICIO* ✨\n\n` +
          `Hola *${target.customerName}*, te compartimos los detalles de tu servicio:\n\n` +
          `📋 *Folio:* ${target.ticketNo}\n` +
          `📅 *Fecha Recepción:* ${target.date}\n` +
          `📦 *Entrega Estimada:* ${target.deliveryDate}\n\n` +
          `👟 *Servicios y Artículos:*\n${itemsText}\n\n` +
          `💰 *Total:* $${target.total} MXN\n` +
          `💵 *Anticipo Pagado:* $${target.paidAmount} MXN\n` +
          `📌 *Saldo Pendiente:* $${target.total - target.paidAmount} MXN\n\n` +
          `📍 *Sucursal:* ${branches.find(b => b.id === target.branchId)?.name || 'FOREVER WHITE.MX'}\n\n` +
          `¡Gracias por tu confianza! 👟✨`;

        const url = `https://wa.me/52${target.customerPhone}?text=${encodeURIComponent(text)}`;
        window.open(url, '_blank');
      };

      const handleSaveCustomer = (e) => {
        e.preventDefault();
        if (!newCustomer.name || !newCustomer.phone) return;
        const created = { id: `c-${Date.now()}`, ...newCustomer, dateAdded: new Date().toISOString().split('T')[0] };
        setCustomers([created, ...customers]);
        setShowAddCustomerModal(false);
        setNewCustomer({ name: '', phone: '', channel: 'TikTok', notes: '', branchId: 'b1' });
        if (activeTab === 'pos') setPosSelectedCustomer(created);
        showToast('👤 Cliente registrado correctamente.', 'success');
      };

      const handleSaveBranch = (e) => {
        e.preventDefault();
        if (!newBranch.name || !newBranch.address) {
          showToast('⚠️️ Nombre y dirección son obligatorios.', 'warning');
          return;
        }
        const created = { id: `b-${Date.now()}`, ...newBranch };
        setBranches([...branches, created]);
        setShowAddBranchModal(false);
        setNewBranch({ name: '', address: '', phone: '', manager: '' });
        showToast('🏢 Sucursal registrada con éxito!', 'success');
      };

      const handleSaveUser = (e) => {
        e.preventDefault();
        if (!newUser.email || !newUser.name) return;
        const created = { id: `u-${Date.now()}`, ...newUser };
        setUsers([...users, created]);
        setShowAddUserModal(false);
        setNewUser({ email: '', name: '', role: 'cashier', branchId: 'b1' });
        showToast('✉️ Usuario y permisos agregados con éxito!', 'success');
      };

      const handleLoginByEmail = (e) => {
        e.preventDefault();
        const found = users.find(u => u.email.toLowerCase() === loginEmailInput.trim().toLowerCase());
        if (found) {
          setCurrentUser(found);
          setShowLoginModal(false);
          setLoginEmailInput('');
          showToast(`🔓 Sesión iniciada como: ${found.name} (${found.role.toUpperCase()})`, 'success');
        } else {
          showToast('❌ Correo no registrado. Solicita acceso al Administrador.', 'error');
        }
      };

      return (
        <div className="min-h-screen flex flex-col md:flex-row bg-[#03000a] text-slate-100 font-sans antialiased">
          
          {/* TOAST NOTIFICATION */}
          {toast && (
            <div className={`fixed top-4 right-4 z-50 px-4 py-3 rounded-2xl shadow-2xl font-bold text-xs flex items-center gap-2 border transition backdrop-blur-md ${
              toast.type === 'error' ? 'bg-rose-950/90 border-rose-800 text-rose-200' :
              toast.type === 'warning' ? 'bg-amber-950/90 border-amber-800 text-amber-200' :
              'bg-purple-950/90 border-purple-800 text-purple-200'
            }`}>
              <Icon name="alertTriangle" className="w-4 h-4 shrink-0" />
              <span>{toast.message}</span>
            </div>
          )}

          {/* SIDEBAR NAVIGATION */}
          <aside className="w-full md:w-64 bg-[#080214] border-r border-purple-950/80 flex flex-col shrink-0">
            
            {/* BRAND HEADER */}
            <div className="p-5 border-b border-purple-950/80 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <img 
                  src={LOGO_URL} 
                  alt="Forever White Logo" 
                  className="w-10 h-10 object-contain rounded-xl border border-purple-500/30 p-0.5 bg-black" 
                  onError={(e) => { e.target.style.display = 'none'; }}
                />
                <div>
                  <h1 className="font-black text-sm tracking-tight text-white uppercase leading-none">
                    FOREVER <span className="text-purple-400">WHITE.MX</span>
                  </h1>
                  <p className="text-[9px] text-purple-300/70 tracking-widest font-mono mt-1">SUITE PROFESIONAL</p>
                </div>
              </div>
            </div>

            {/* USER LOGIN & ROLE BADGE */}
            <div className="p-3 mx-3 mt-3 rounded-2xl bg-[#03000a] border border-purple-900/50 space-y-2">
              <div className="flex items-center justify-between text-[11px] font-semibold text-purple-200">
                <span className="flex items-center gap-1.5 truncate">
                  <Icon name="mail" className="w-3.5 h-3.5 text-purple-400 shrink-0" /> 
                  <span className="truncate">{currentUser.name}</span>
                </span>
                <span className={`px-2 py-0.5 rounded-full text-[9px] uppercase font-bold shrink-0 ${
                  currentUser.role === 'admin' ? 'bg-purple-950 text-purple-300 border border-purple-700' :
                  currentUser.role === 'cashier' ? 'bg-amber-950 text-amber-300 border border-amber-800' :
                  'bg-slate-900 text-slate-300 border border-slate-700'
                }`}>
                  {currentUser.role}
                </span>
              </div>
              <p className="text-[10px] text-purple-300/60 truncate font-mono">{currentUser.email}</p>
              
              <button 
                onClick={() => setShowLoginModal(true)} 
                className="w-full py-1.5 bg-purple-950/80 hover:bg-purple-900 text-purple-200 border border-purple-800/80 rounded-xl text-[10px] font-bold flex items-center justify-center gap-1.5 transition"
              >
                <Icon name="userCheck" className="w-3 h-3" /> Cambiar / Entrar por Correo
              </button>
            </div>

            {/* SUCURSAL SELECTOR */}
            <div className="p-3 mx-3 mt-2 rounded-2xl bg-[#03000a] border border-purple-900/40 space-y-1.5">
              <div className="flex items-center justify-between">
                <label className="text-[10px] font-bold uppercase tracking-wider text-purple-300/80 block">Sucursal Atendiendo</label>
                {currentUser.role === 'admin' && (
                  <button onClick={() => setShowAddBranchModal(true)} className="text-[10px] text-purple-400 font-bold hover:text-purple-300 flex items-center gap-0.5">
                    <Icon name="plus" className="w-3 h-3" /> Agregar
                  </button>
                )}
              </div>
              <select 
                value={selectedBranchId} 
                onChange={e => setSelectedBranchId(e.target.value)}
                className="w-full bg-[#0d051d] border border-purple-900/60 rounded-xl text-xs py-1.5 px-2 text-slate-200 font-semibold focus:outline-none focus:border-purple-500"
              >
                <option value="all">🌐 Todas las Sucursales ({branches.length})</option>
                {branches.map(b => <option key={b.id} value={b.id}>{b.name}</option>)}
              </select>
            </div>

            {/* NAV LINKS */}
            <nav className="p-3 space-y-1 flex-1 mt-2 font-medium text-xs">
              <button onClick={() => setActiveTab('pos')} className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition ${activeTab === 'pos' ? 'bg-purple-600/20 text-purple-300 border border-purple-500/30 font-bold' : 'text-slate-400 hover:bg-purple-950/30 hover:text-white'}`}>
                <Icon name="fileText" /> Nuevo Recibo / POS
              </button>
              
              <button onClick={() => setActiveTab('crm')} className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition ${activeTab === 'crm' ? 'bg-purple-600/20 text-purple-300 border border-purple-500/30 font-bold' : 'text-slate-400 hover:bg-purple-950/30 hover:text-white'}`}>
                <Icon name="users" /> CRM Clientes
              </button>

              {currentUser.role === 'admin' && (
                <React.Fragment>
                  <button onClick={() => setActiveTab('branches')} className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition ${activeTab === 'branches' ? 'bg-purple-600/20 text-purple-300 border border-purple-500/30 font-bold' : 'text-slate-400 hover:bg-purple-950/30 hover:text-white'}`}>
                    <Icon name="store" /> Sucursales ({branches.length})
                  </button>
                  <button onClick={() => setActiveTab('reports')} className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition ${activeTab === 'reports' ? 'bg-purple-600/20 text-purple-300 border border-purple-500/30 font-bold' : 'text-slate-400 hover:bg-purple-950/30 hover:text-white'}`}>
                    <Icon name="barChart" /> Reportes & Métricas
                  </button>
                  <button onClick={() => setActiveTab('inventory')} className={`w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl transition ${activeTab === 'inventory' ? 'bg-purple-600/20 text-purple-300 border border-purple-500/30 font-bold' : 'text-slate-400 hover:bg-purple-950/30 hover:text-white'}`}>
                    <span className="flex items-center gap-3"><Icon name="box" /> Inventario & Consumos</span>
                  </button>
                  <button onClick={() => setActiveTab('expenses')} className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition ${activeTab === 'expenses' ? 'bg-purple-600/20 text-purple-300 border border-purple-500/30 font-bold' : 'text-slate-400 hover:bg-purple-950/30 hover:text-white'}`}>
                    <Icon name="trendingDown" /> Gastos & Egresos
                  </button>
                  <button onClick={() => setActiveTab('promos')} className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition ${activeTab === 'promos' ? 'bg-purple-600/20 text-purple-300 border border-purple-500/30 font-bold' : 'text-slate-400 hover:bg-purple-950/30 hover:text-white'}`}>
                    <Icon name="tag" /> Códigos & Convenios
                  </button>
                </React.Fragment>
              )}

              <button onClick={() => setActiveTab('catalog')} className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition ${activeTab === 'catalog' ? 'bg-purple-600/20 text-purple-300 border border-purple-500/30 font-bold' : 'text-slate-400 hover:bg-purple-950/30 hover:text-white'}`}>
                <Icon name="shoppingBag" /> Servicios & Productos
              </button>

              {currentUser.role === 'admin' && (
                <button onClick={() => setActiveTab('team')} className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition ${activeTab === 'team' ? 'bg-purple-600/20 text-purple-300 border border-purple-500/30 font-bold' : 'text-slate-400 hover:bg-purple-950/30 hover:text-white'}`}>
                  <Icon name="shield" /> Equipo & Roles
                </button>
              )}
            </nav>
          </aside>

          {/* MAIN CONTENT AREA */}
          <main className="flex-1 p-4 md:p-8 overflow-y-auto bg-[#03000a]">
            
            {/* POS MODULE */}
            {activeTab === 'pos' && (
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                
                {/* POS FORM */}
                <div className="lg:col-span-7 space-y-5">
                  <div className="flex justify-between items-center pb-3 border-b border-purple-950/80">
                    <div>
                      <h2 className="text-xl font-bold text-white flex items-center gap-2">
                        <Icon name="fileText" className="text-purple-400" /> Nuevo Recibo de Atención
                      </h2>
                      <p className="text-xs text-purple-300/70">FOREVER WHITE.MX - Control de Recepción de Artículos</p>
                    </div>
                  </div>

                  <form onSubmit={handleCreateOrder} className="space-y-4">
                    
                    {/* Branch & Delivery Date */}
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3 p-4 bg-[#080214] rounded-2xl border border-purple-950/80">
                      <div>
                        <div className="flex justify-between items-center mb-1">
                          <label className="text-[10px] font-bold text-purple-300/80 uppercase">Sucursal Atendiendo</label>
                          {currentUser.role === 'admin' && (
                            <button type="button" onClick={() => setShowAddBranchModal(true)} className="text-[10px] text-purple-400 font-bold hover:underline">+ Nueva</button>
                          )}
                        </div>
                        <select value={posBranchId} onChange={e => setPosBranchId(e.target.value)} className="w-full bg-[#03000a] border border-purple-900/60 rounded-xl p-2 text-xs text-white focus:border-purple-500">
                          {branches.map(b => <option key={b.id} value={b.id}>{b.name}</option>)}
                        </select>
                      </div>
                      <div>
                        <label className="text-[10px] font-bold text-purple-300/80 uppercase block mb-1">Fecha Promesa de Entrega</label>
                        <input type="date" value={posDeliveryDate} onChange={e => setPosDeliveryDate(e.target.value)} className="w-full bg-[#03000a] border border-purple-900/60 rounded-xl p-2 text-xs text-white focus:border-purple-500" />
                      </div>
                    </div>

                    {/* Customer Selection */}
                    <div className="p-4 bg-[#080214] rounded-2xl border border-purple-950/80 space-y-3">
                      <div className="flex justify-between items-center">
                        <span className="text-[10px] font-bold text-purple-300/80 uppercase">Cliente Asignado</span>
                        <button type="button" onClick={() => setShowAddCustomerModal(true)} className="text-xs text-purple-400 font-bold flex items-center gap-1 hover:text-purple-300">
                          <Icon name="plus" className="w-3.5 h-3.5" /> Registrar Nuevo
                        </button>
                      </div>

                      <div className="relative">
                        <Icon name="search" className="w-4 h-4 absolute left-3 top-2.5 text-purple-500" />

                      </div>

                        <div className="max-h-36 overflow-y-auto bg-[#03000a] border border-purple-900/80 rounded-xl divide-y divide-purple-900/40">
                          {customers.filter(c => c.name.toLowerCase().includes(posCustomerSearch.toLowerCase()) || c.phone.includes(posCustomerSearch)).map(c => (
                            <div key={c.id} onClick={() => { setPosSelectedCustomer(c); setPosCustomerSearch(''); }} className="p-2.5 hover:bg-purple-900/30 cursor-pointer flex justify-between text-xs">
                              <div>
                                <p className="font-bold text-white">{c.name}</p>
                                <p className="text-[10px] text-purple-300/60">📱 {c.phone} | Conoció por: {c.channel}</p>
                              </div>
                              <span className="text-purple-400 font-bold">Seleccionar</span>
                            </div>
                          ))}
                        </div>
                      )}

                      {posSelectedCustomer ? (
                        <div className="p-3 bg-purple-950/40 border border-purple-800 rounded-xl flex justify-between items-center text-xs">
                          <div>
                            <p className="font-bold text-purple-300">{posSelectedCustomer.name}</p>
                            <p className="text-[10px] text-purple-300/60">Tel: {posSelectedCustomer.phone} | Canal: {posSelectedCustomer.channel}</p>
                          </div>
                          <button type="button" onClick={() => setPosSelectedCustomer(null)} className="text-slate-400 hover:text-rose-400">
                            <Icon name="x" className="w-4 h-4" />
                          </button>
                        </div>
                      ) : (
                        <p className="text-xs text-amber-400/90 italic">⚠️️ Selecciona o agrega un cliente para emitir el recibo.</p>
                      )}
                    </div>

                    {/* Quantity by Item Type (Calzado, Gorras, Equipaje) */}
                    <div className="p-4 bg-[#080214] rounded-2xl border border-purple-950/80 space-y-3">
                      <span className="text-[10px] font-bold text-purple-300/80 uppercase block">Conteo de Artículos Recibidos</span>
                      <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                        <div className="p-2.5 bg-[#03000a] border border-purple-900/60 rounded-xl text-center space-y-1">
                          <span className="text-xs font-bold text-purple-200">👟 Calzado</span>
                          <div className="flex items-center justify-center gap-2">
                            <button type="button" onClick={() => setPosItemCounts(p => ({ ...p, calzado: Math.max(0, p.calzado - 1) }))} className="w-5 h-5 bg-purple-950 rounded text-xs font-bold text-purple-300">-</button>
                            <span className="font-mono text-sm font-bold text-white">{posItemCounts.calzado}</span>
                            <button type="button" onClick={() => setPosItemCounts(p => ({ ...p, calzado: p.calzado + 1 }))} className="w-5 h-5 bg-purple-950 rounded text-xs font-bold text-purple-300">+</button>
                          </div>
                        </div>
                        <div className="p-2.5 bg-[#03000a] border border-purple-900/60 rounded-xl text-center space-y-1">
                          <span className="text-xs font-bold text-purple-200">🧢 Gorras</span>
                          <div className="flex items-center justify-center gap-2">
                            <button type="button" onClick={() => setPosItemCounts(p => ({ ...p, gorras: Math.max(0, p.gorras - 1) }))} className="w-5 h-5 bg-purple-950 rounded text-xs font-bold text-purple-300">-</button>
                            <span className="font-mono text-sm font-bold text-white">{posItemCounts.gorras}</span>
                            <button type="button" onClick={() => setPosItemCounts(p => ({ ...p, gorras: p.gorras + 1 }))} className="w-5 h-5 bg-purple-950 rounded text-xs font-bold text-purple-300">+</button>
                          </div>
                        </div>
                        <div className="p-2.5 bg-[#03000a] border border-purple-900/60 rounded-xl text-center space-y-1">
                          <span className="text-xs font-bold text-purple-200">🧳 Equipaje</span>
                          <div className="flex items-center justify-center gap-2">
                            <button type="button" onClick={() => setPosItemCounts(p => ({ ...p, equipaje: Math.max(0, p.equipaje - 1) }))} className="w-5 h-5 bg-purple-950 rounded text-xs font-bold text-purple-300">-</button>
                            <span className="font-mono text-sm font-bold text-white">{posItemCounts.equipaje}</span>
                            <button type="button" onClick={() => setPosItemCounts(p => ({ ...p, equipaje: p.equipaje + 1 }))} className="w-5 h-5 bg-purple-950 rounded text-xs font-bold text-purple-300">+</button>
                          </div>
                        </div>
                        <div className="p-2.5 bg-[#03000a] border border-purple-900/60 rounded-xl text-center space-y-1">
                          <span className="text-xs font-bold text-purple-200">👕 Varios</span>
                          <div className="flex items-center justify-center gap-2">
                            <button type="button" onClick={() => setPosItemCounts(p => ({ ...p, prendas: Math.max(0, p.prendas - 1) }))} className="w-5 h-5 bg-purple-950 rounded text-xs font-bold text-purple-300">-</button>
                            <span className="font-mono text-sm font-bold text-white">{posItemCounts.prendas}</span>
                            <button type="button" onClick={() => setPosItemCounts(p => ({ ...p, prendas: p.prendas + 1 }))} className="w-5 h-5 bg-purple-950 rounded text-xs font-bold text-purple-300">+</button>
                          </div>
                        </div>
                      </div>
                    </div>

                    {/* Services Selection */}
                    <div className="p-4 bg-[#080214] rounded-2xl border border-purple-950/80 space-y-3">
                      <span className="text-[10px] font-bold text-purple-300/80 uppercase block">Selección de Servicios y Productos</span>
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 max-h-44 overflow-y-auto pr-1">
                        {services.map(srv => (
                          <button key={srv.id} type="button" onClick={() => handleAddPosItem(srv)} className="p-2.5 bg-[#03000a] border border-purple-900/50 hover:border-purple-500 text-left rounded-xl transition text-xs flex justify-between items-center group">
                            <div>
                              <p className="font-bold text-white group-hover:text-purple-300">{srv.name}</p>
                              <p className="text-[10px] text-purple-300/70">${srv.price} MXN | {srv.category}</p>
                            </div>
                            <Icon name="plus" className="text-purple-400" />
                          </button>
                        ))}
                      </div>

                      {posItems.length > 0 && (
                        <div className="pt-2 border-t border-purple-900/60 space-y-2">
                          {posItems.map(item => (
                            <div key={item.serviceId} className="p-2 bg-[#03000a] border border-purple-900/60 rounded-xl flex justify-between items-center text-xs">
                              <span className="font-semibold text-white">{item.name}</span>
                              <div className="flex items-center gap-2">
                                <button type="button" onClick={() => handleUpdateItemQty(item.serviceId, item.qty - 1)} className="w-5 h-5 bg-purple-950 rounded text-purple-300 font-bold">-</button>
                                <span className="font-mono text-purple-300">{item.qty}</span>
                                <button type="button" onClick={() => handleUpdateItemQty(item.serviceId, item.qty + 1)} className="w-5 h-5 bg-purple-950 rounded text-purple-300 font-bold">+</button>
                                <span className="font-bold text-purple-300 font-mono w-16 text-right">${item.price * item.qty}</span>
                                <button type="button" onClick={() => handleRemovePosItem(item.serviceId)} className="text-rose-400">
                                  <Icon name="trash" className="w-3.5 h-3.5" />
                                </button>
                              </div>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>

                    {/* Photo Upload & Observaciones */}
                    <div className="p-4 bg-[#080214] rounded-2xl border border-purple-950/80 space-y-3">

                      <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                        <textarea rows={3} placeholder="Detalles de raspaduras, manchas, desgaste previo o anotaciones..." value={posShoeNotes} onChange={e => setPosShoeNotes(e.target.value)} className="w-full bg-[#03000a] border border-purple-900/60 rounded-xl p-2 text-xs text-white focus:border-purple-500" />
                        <div className="border-2 border-dashed border-purple-900/60 rounded-xl p-3 bg-[#03000a] flex flex-col items-center justify-center relative">
                          {posShoePhoto ? (
                            <div className="relative w-full h-24">
                              <img src={posShoePhoto} alt="Evidencia" className="w-full h-full object-cover rounded-lg" />
                              <button type="button" onClick={() => setPosShoePhoto('')} className="absolute top-1 right-1 p-1 bg-black/80 rounded-full text-rose-400">
                                <Icon name="x" className="w-3 h-3" />
                              </button>
                            </div>
                          ) : (
                            <label className="cursor-pointer flex flex-col items-center">
                              <Icon name="camera" className="w-6 h-6 text-purple-400 mb-1" />
                              <span className="text-xs text-purple-200 font-bold">Tomar / Cargar Foto</span>
                              <input type="file" accept="image/*" onChange={handleShoePhotoUpload} className="hidden" />
                            </label>
                          )}
                        </div>
                      </div>
                    </div>

                    {/* Discounts, Promos & Convenios */}

                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <div>
                          <label className="text-[10px] text-purple-300/80 font-bold block mb-1">Código Promocional</label>
                          <input type="text" placeholder="Ej. BIENVENIDA" value={posPromoCode} onChange={e => setPosPromoCode(e.target.value)} className="w-full bg-[#03000a] border border-purple-900/60 rounded-xl p-1.5 text-xs text-white uppercase font-mono" />
                        </div>
                        <div>
                          <label className="text-[10px] text-purple-300/80 font-bold block mb-1">Convenio / Aliado</label>
                          <select value={posSelectedConvenioId} onChange={e => setPosSelectedConvenioId(e.target.value)} className="w-full bg-[#03000a] border border-purple-900/60 rounded-xl p-1.5 text-xs text-white">
                            <option value="">Sin convenio</option>
                            {convenios.map(c => <option key={c.id} value={c.id}>{c.name} (-{c.discountPercent}%)</option>)}
                          </select>
                        </div>
                        <div>
                          <label className="text-[10px] text-purple-300/80 font-bold block mb-1">Descuento Directo ($)</label>
                          <input type="number" value={posDiscount} onChange={e => setPosDiscount(e.target.value)} className="w-full bg-[#03000a] border border-purple-900/60 rounded-xl p-1.5 text-xs text-white" />
                        </div>
                      </div>

                      <div className="grid grid-cols-2 gap-3 pt-2">
                        <div>
                          <label className="text-[10px] text-purple-300/80 font-bold block mb-1">Anticipo Pagado ($)</label>
                          <input type="number" value={posPaidAmount} onChange={e => setPosPaidAmount(e.target.value)} className="w-full bg-[#03000a] border border-purple-900/60 rounded-xl p-1.5 text-xs text-white font-bold" />
                        </div>
                        <div>
                          <label className="text-[10px] text-purple-300/80 font-bold block mb-1">Forma de Pago</label>
                          <select value={posPaymentMethod} onChange={e => setPosPaymentMethod(e.target.value)} className="w-full bg-[#03000a] border border-purple-900/60 rounded-xl p-1.5 text-xs text-white">
                            <option value="efectivo">💵 Efectivo</option>
                            <option value="tarjeta">💳 Tarjeta</option>
                            <option value="transferencia">📲 Transferencia</option>
                          </select>
                        </div>
                      </div>

                      <div className="pt-3 border-t border-purple-900/60 flex justify-between items-center">
                        <div>
                          <p className="text-xs text-purple-300/70">Total a Cobrar:</p>
                          <p className="text-2xl font-black text-purple-400 font-mono">${posTotal} MXN</p>
                        </div>
                        <button type="submit" className="px-5 py-2.5 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-bold text-xs rounded-xl shadow-lg shadow-purple-900/50 flex items-center gap-1.5">
                          <Icon name="check" /> Guardar Recibo
                        </button>
                      </div>
                    </div>

                  </form>
                </div>

                {/* DIGITAL PHOTO TICKET PREVIEW CARD */}
                <div className="lg:col-span-5 space-y-4">
                  <div className="flex justify-between items-center">
                    <h3 className="text-xs font-bold text-purple-300/80 uppercase flex items-center gap-2">
                      <Icon name="sparkles" className="text-purple-400" /> Foto Ticket Digital FOREVER WHITE.MX
                    </h3>
                  </div>

                  {/* HIGH END STYLED CARD FOR INSTANT PHOTO GENERATION */}
                  <div id="digital-photo-ticket-card" className="p-6 rounded-3xl bg-[#080214] border-2 border-purple-500/40 shadow-2xl space-y-4 glow-purple relative overflow-hidden">
                    
                    {/* Glowing Header */}
                    <div className="flex justify-between items-start border-b border-purple-900/60 pb-3">
                      <div className="flex items-center gap-3">
                        <img src={LOGO_URL} alt="Logo" className="w-12 h-12 object-contain bg-black rounded-xl p-1 border border-purple-500/40" onError={(e) => { e.target.style.display = 'none'; }} />
                        <div>
                          <h1 className="text-base font-black tracking-wider text-white">FOREVER WHITE.MX</h1>
                          <p className="text-[9px] text-purple-400 tracking-widest font-mono">RECIBO OFICIAL DIGITAL</p>
                        </div>
                      </div>
                      <span className="px-2.5 py-1 bg-purple-950 border border-purple-700 text-purple-300 text-[10px] font-mono font-bold rounded-full">
                        {activeTicket?.ticketNo || 'FW-2026-TEMP'}
                      </span>
                    </div>

                    {/* Customer & Delivery Data */}
                    <div className="grid grid-cols-2 gap-2 text-[11px] bg-[#03000a] p-3 rounded-2xl border border-purple-900/40 font-mono">
                      <div>
                        <span className="text-[9px] text-purple-400 font-bold uppercase block">CLIENTE</span>
                        <span className="font-bold text-white truncate block">{activeTicket?.customerName || posSelectedCustomer?.name || 'Cliente Mostrador'}</span>
                      </div>
                      <div>
                        <span className="text-[9px] text-purple-400 font-bold uppercase block">ENTREGA ESTIMADA</span>
                        <span className="font-bold text-purple-300 block">{activeTicket?.deliveryDate || posDeliveryDate}</span>
                      </div>
                    </div>

                    {/* Quantities Badges */}
                    <div className="flex gap-2 text-[10px] font-bold">
                      <span className="px-2.5 py-1 bg-purple-950/80 border border-purple-800 text-purple-200 rounded-lg">👟 {activeTicket?.itemCounts?.calzado || posItemCounts.calzado} pares</span>
                      <span className="px-2.5 py-1 bg-purple-950/80 border border-purple-800 text-purple-200 rounded-lg">🧢 {activeTicket?.itemCounts?.gorras || posItemCounts.gorras} gorras</span>
                      <span className="px-2.5 py-1 bg-purple-950/80 border border-purple-800 text-purple-200 rounded-lg">🧳 {activeTicket?.itemCounts?.equipaje || posItemCounts.equipaje} equipaje</span>
                    </div>

                    {/* Itemized Services */}
                    <div className="space-y-1.5 border-t border-b border-purple-900/60 py-3">
                      {(activeTicket ? activeTicket.items : posItems).map((i, idx) => (
                        <div key={idx} className="flex justify-between text-xs font-medium">
                          <span className="text-slate-200">{i.qty}x {i.name}</span>
                          <span className="font-mono text-purple-300 font-bold">${i.price * i.qty}</span>
                        </div>
                      ))}
                    </div>

                    {/* Shoe Evidence Image Preview */}
                    {(activeTicket?.shoePhoto || posShoePhoto) && (
                      <div className="space-y-1 text-center">
                        <span className="text-[9px] text-purple-300 uppercase font-bold block">EVIDENCIA FOTOGRÁFICA PREVIA</span>
                        <img src={activeTicket?.shoePhoto || posShoePhoto} alt="Evidencia" className="w-full h-32 object-cover rounded-2xl border border-purple-800" />
                      </div>
                    )}

                    {/* Totals & Savings */}
                    <div className="pt-1 flex justify-between items-center text-sm font-black">
                      <span className="text-slate-300">TOTAL:</span>
                      <span className="text-xl text-purple-400 font-mono">${activeTicket?.total || posTotal} MXN</span>
                    </div>

                    {/* Direct WhatsApp Redirect & Action Buttons */}
                    <div className="space-y-2 pt-2 border-t border-purple-900/60">
                      <button onClick={() => handleOpenWhatsAppChat(activeTicket || orders[0])} className="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs rounded-xl flex items-center justify-center gap-2 shadow">
                        <Icon name="messageCircle" /> 📲 Enviar por WhatsApp Directo
                      </button>
                      <button onClick={() => handleGenerateTicketImage(activeTicket || orders[0])} disabled={isGeneratingImage} className="w-full py-2 bg-purple-950 hover:bg-purple-900 text-purple-200 font-bold text-xs rounded-xl border border-purple-800 flex items-center justify-center gap-2">
                        <Icon name="camera" /> Generar Foto HD para Enviar
                      </button>
                      <button onClick={() => handlePrintThermalTicket(activeTicket || orders[0])} className="w-full py-2 bg-[#03000a] text-slate-300 hover:text-white font-bold text-xs rounded-xl border border-purple-950 flex items-center justify-center gap-2">
                        <Icon name="printer" /> Imprimir en Ticketera Térmica
                      </button>
                    </div>

                  </div>
                </div>

              </div>
            )}

            {/* SUCURSALES MODULE */}
            {activeTab === 'branches' && currentUser.role === 'admin' && (
              <div className="space-y-6">
                <div className="flex justify-between items-center pb-3 border-b border-purple-950/80">
                  <div>
                    <h2 className="text-xl font-bold text-white flex items-center gap-2">
                      <Icon name="store" className="text-purple-400" /> Gestión de Sucursales
                    </h2>
                    <p className="text-xs text-purple-300/70">Administra las ubicaciones físicas de FOREVER WHITE.MX</p>
                  </div>
                  <button onClick={() => setShowAddBranchModal(true)} className="px-3.5 py-2 bg-purple-600 hover:bg-purple-500 text-white font-bold text-xs rounded-xl flex items-center gap-1.5 shadow-lg shadow-purple-900/50">
                    <Icon name="plus" /> Agregar Nueva Sucursal
                  </button>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  {branches.map(b => {
                    const branchOrdersCount = orders.filter(o => o.branchId === b.id).length;
                    const branchRevenue = orders.filter(o => o.branchId === b.id).reduce((sum, o) => sum + Number(o.total), 0);

                    return (
                      <div key={b.id} className="p-5 bg-[#080214] border border-purple-900/80 rounded-2xl space-y-3 relative group hover:border-purple-500 transition">
                        <div className="flex justify-between items-start">
                          <div className="p-2.5 bg-purple-950/80 rounded-xl border border-purple-800 text-purple-300">
                            <Icon name="store" className="w-5 h-5" />
                          </div>
                          <span className="text-[10px] font-mono px-2 py-0.5 rounded-full bg-purple-950 text-purple-300 border border-purple-800 font-bold">
                            ID: {b.id}
                          </span>
                        </div>

                        <div>
                          <h3 className="font-bold text-white text-sm">{b.name}</h3>
                          <p className="text-xs text-purple-300/70 flex items-center gap-1 mt-1">
                            <Icon name="mapPin" className="w-3.5 h-3.5 text-purple-400 shrink-0" />
                            {b.address}
                          </p>
                          <p className="text-xs text-purple-300/70 flex items-center gap-1 mt-1 font-mono">
                            <Icon name="phone" className="w-3.5 h-3.5 text-purple-400 shrink-0" />
                            {b.phone}
                          </p>
                          {b.manager && (
                            <p className="text-[11px] text-slate-400 mt-2">
                              👤 Encargado: <span className="text-purple-300 font-bold">{b.manager}</span>
                            </p>
                          )}
                        </div>

                        <div className="pt-3 border-t border-purple-950/80 flex justify-between items-center text-xs">
                          <div>
                            <span className="text-[10px] text-purple-300/60 block">RECIBOS</span>
                            <span className="font-mono font-bold text-white">{branchOrdersCount}</span>
                          </div>
                          <div className="text-right">
                            <span className="text-[10px] text-purple-300/60 block">ACUMULADO</span>
                            <span className="font-mono font-bold text-purple-400">${branchRevenue.toLocaleString()} MXN</span>
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* REPORTES & METRICAS MODULE */}
            {activeTab === 'reports' && currentUser.role === 'admin' && (
              <div className="space-y-6">
                <div className="flex justify-between items-center pb-3 border-b border-purple-950/80">
                  <div>
                    <h2 className="text-xl font-bold text-white flex items-center gap-2">
                      <Icon name="barChart" className="text-purple-400" /> Analytics & Reportes de Servicios
                    </h2>
                    <p className="text-xs text-purple-300/70">Métricas por periodo, canal de captación y tipo de prendas atendidas.</p>
                  </div>
                  <div className="flex bg-[#080214] p-1 rounded-xl border border-purple-900/60 text-xs font-semibold">
                    {['day', 'week', 'month', 'year'].map(tf => (
                      <button key={tf} onClick={() => setReportTimeframe(tf)} className={`px-3 py-1.5 rounded-lg uppercase text-[10px] ${reportTimeframe === tf ? 'bg-purple-600 text-white font-bold' : 'text-purple-300/70'}`}>
                        {tf === 'day' ? 'Día' : tf === 'week' ? 'Semana' : tf === 'month' ? 'Mes' : 'Año'}
                      </button>
                    ))}
                  </div>
                </div>

                {/* Metrics Highlights */}
                <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                  <div className="p-4 bg-[#080214] border border-purple-950/80 rounded-2xl">
                    <span className="text-[10px] text-purple-300/80 font-bold uppercase">Ingresos Totales</span>
                    <p className="text-2xl font-black text-white mt-1">${financialMetrics.totalRevenue.toLocaleString()} MXN</p>
                  </div>
                  <div className="p-4 bg-[#080214] border border-purple-950/80 rounded-2xl">
                    <span className="text-[10px] text-purple-300/80 font-bold uppercase">Egresos / Gastos</span>
                    <p className="text-2xl font-black text-rose-400 mt-1">${financialMetrics.totalExpenses.toLocaleString()} MXN</p>
                  </div>
                  <div className="p-4 bg-[#080214] border border-purple-950/80 rounded-2xl">
                    <span className="text-[10px] text-purple-300/80 font-bold uppercase">Servicio Más Demandado</span>
                    <p className="text-sm font-black text-purple-300 mt-1 truncate">{financialMetrics.topServiceName}</p>
                    <p className="text-[10px] text-purple-400/80 font-mono">{financialMetrics.topServiceCount} solicitudes</p>
                  </div>
                  <div className="p-4 bg-[#080214] border border-purple-950/80 rounded-2xl">
                    <span className="text-[10px] text-purple-300/80 font-bold uppercase">Margen de Utilidad</span>
                    <p className="text-2xl font-black text-emerald-400 mt-1">{financialMetrics.profitMargin}%</p>
                  </div>
                </div>

                {/* Item Type Counts */}
                <div className="p-5 bg-[#080214] border border-purple-950/80 rounded-2xl space-y-3">
                  <h3 className="text-sm font-bold text-white flex items-center gap-2">
                    <Icon name="box" className="text-purple-400" /> Total de Calzado, Gorras y Equipaje Atendidos ({reportTimeframe.toUpperCase()})
                  </h3>
                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                    <div className="p-3 bg-[#03000a] border border-purple-900/60 rounded-xl text-center">
                      <span className="text-xs text-purple-300 font-bold">👟 Calzado</span>
                      <p className="text-2xl font-mono font-black text-white mt-1">{financialMetrics.itemTotals.calzado}</p>
                    </div>
                    <div className="p-3 bg-[#03000a] border border-purple-900/60 rounded-xl text-center">
                      <span className="text-xs text-purple-300 font-bold">🧢 Gorras</span>
                      <p className="text-2xl font-mono font-black text-white mt-1">{financialMetrics.itemTotals.gorras}</p>
                    </div>
                    <div className="p-3 bg-[#03000a] border border-purple-900/60 rounded-xl text-center">
                      <span className="text-xs text-purple-300 font-bold">🧳 Equipaje</span>
                      <p className="text-2xl font-mono font-black text-white mt-1">{financialMetrics.itemTotals.equipaje}</p>
                    </div>
                    <div className="p-3 bg-[#03000a] border border-purple-900/60 rounded-xl text-center">
                      <span className="text-xs text-purple-300 font-bold">👕 Varios</span>
                      <p className="text-2xl font-mono font-black text-white mt-1">{financialMetrics.itemTotals.prendas}</p>
                    </div>
                  </div>
                </div>

                {/* Acquisition Channel Breakdown */}
                <div className="p-5 bg-[#080214] border border-purple-950/80 rounded-2xl space-y-3">
                  <h3 className="text-sm font-bold text-white flex items-center gap-2">
                    <Icon name="users" className="text-purple-400" /> ¿De Dónde Nos Conocieron Nuestros Clientes?
                  </h3>
                  <CustomBarChart 
                    data={Object.keys(financialMetrics.channelCountMap).map(ch => ({ label: ch, val: financialMetrics.channelCountMap[ch] }))} 
                    keyKey="label" 
                    valueKey="val" 
                    colorClass="bg-purple-500" 
                  />
                </div>

              </div>
            )}

            {/* TEAM & EMAIL ROLES MODULE */}
            {activeTab === 'team' && currentUser.role === 'admin' && (
              <div className="space-y-4">
                <div className="flex justify-between items-center pb-3 border-b border-purple-950/80">
                  <h2 className="text-xl font-bold text-white flex items-center gap-2">
                    <Icon name="shield" className="text-purple-400" /> Equipo de Trabajo & Control por Correo
                  </h2>
                  <button onClick={() => setShowAddUserModal(true)} className="px-3 py-1.5 bg-purple-600 text-white font-bold text-xs rounded-xl flex items-center gap-1">
                    <Icon name="plus" /> Registrar Usuario
                  </button>
                </div>

                <div className="bg-[#080214] rounded-2xl border border-purple-950/80 overflow-x-auto">
                  <table className="w-full text-left text-xs text-slate-300">
                    <thead className="bg-[#03000a] text-purple-300/80 uppercase">
                      <tr>
                        <th className="p-3">Nombre</th>
                        <th className="p-3">Correo</th>
                        <th className="p-3">Rol / Permisos</th>
                        <th className="p-3">Sucursal Asignada</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-purple-950/60">
                      {users.map(u => (
                        <tr key={u.id}>
                          <td className="p-3 font-bold text-white">{u.name}</td>
                          <td className="p-3 font-mono">{u.email}</td>
                          <td className="p-3">
                            <span className={`px-2 py-0.5 rounded font-bold text-[10px] uppercase ${
                              u.role === 'admin' ? 'bg-purple-950 text-purple-300 border border-purple-700' :
                              u.role === 'cashier' ? 'bg-amber-950 text-amber-300 border border-amber-800' :
                              'bg-slate-900 text-slate-300 border border-slate-700'
                            }`}>
                              {u.role}
                            </span>
                          </td>
                          <td className="p-3">{branches.find(b => b.id === u.branchId)?.name || 'Todas'}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* CRM MODULE */}
            {activeTab === 'crm' && (
              <div className="space-y-4">
                <div className="flex justify-between items-center pb-3 border-b border-purple-950/80">
                  <h2 className="text-xl font-bold text-white flex items-center gap-2">
                    <Icon name="users" className="text-purple-400" /> CRM Base de Datos de Clientes
                  </h2>
                  <button onClick={() => setShowAddCustomerModal(true)} className="px-3 py-1.5 bg-purple-600 text-white font-bold text-xs rounded-xl flex items-center gap-1">
                    <Icon name="plus" /> Nuevo Cliente
                  </button>
                </div>

                <div className="bg-[#080214] rounded-2xl border border-purple-950/80 overflow-x-auto">
                  <table className="w-full text-left text-xs text-slate-300">
                    <thead className="bg-[#03000a] text-purple-300/80 uppercase">
                      <tr>
                        <th className="p-3">Nombre</th>
                        <th className="p-3">Teléfono</th>
                        <th className="p-3">¿Cómo nos conoció?</th>
                        <th className="p-3 text-center">Acción</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-purple-950/60">
                      {customers.map(c => (
                        <tr key={c.id}>
                          <td className="p-3 font-bold text-white">{c.name}</td>
                          <td className="p-3 font-mono">{c.phone}</td>
                          <td className="p-3"><span className="px-2 py-0.5 bg-purple-950 text-purple-300 border border-purple-800 rounded-lg">{c.channel}</span></td>
                          <td className="p-3 text-center">
                            <a href={`https://wa.me/52${c.phone}`} target="_blank" rel="noopener noreferrer" className="text-emerald-400 font-bold flex items-center justify-center gap-1">
                              <Icon name="messageCircle" /> WhatsApp
                            </a>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* PROMOS & CONVENIOS MODULE */}
            {activeTab === 'promos' && currentUser.role === 'admin' && (
              <div className="space-y-6">
                <div className="flex justify-between items-center pb-3 border-b border-purple-950/80">
                  <h2 className="text-xl font-bold text-white flex items-center gap-2">
                    <Icon name="tag" className="text-purple-400" /> Códigos Promocionales & Convenios de Fidelización
                  </h2>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {/* Promo Codes */}
                  <div className="p-4 bg-[#080214] border border-purple-950/80 rounded-2xl space-y-3">
                    <h3 className="font-bold text-white text-sm">Códigos de Descuento Activos</h3>
                    <div className="space-y-2">
                      {discountCodes.map((d, i) => (
                        <div key={i} className="p-3 bg-[#03000a] border border-purple-900/60 rounded-xl flex justify-between items-center">
                          <div>
                            <span className="font-mono font-bold text-purple-300">{d.code}</span>
                            <p className="text-[10px] text-purple-300/60">{d.description}</p>
                          </div>
                          <span className="font-mono font-bold text-emerald-400">-{d.percent}%</span>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* Convenios B2B */}
                  <div className="p-4 bg-[#080214] border border-purple-950/80 rounded-2xl space-y-3">
                    <h3 className="font-bold text-white text-sm">Convenios Aliados (Gimnasios / Locales)</h3>
                    <div className="space-y-2">
                      {convenios.map((c, i) => (
                        <div key={i} className="p-3 bg-[#03000a] border border-purple-900/60 rounded-xl flex justify-between items-center">
                          <div>
                            <span className="font-bold text-white text-xs">{c.name}</span>
                            <p className="text-[10px] text-purple-300/60">Contacto: {c.contact}</p>
                          </div>
                          <span className="font-mono font-bold text-purple-400">-{c.discountPercent}%</span>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* CATALOG MODULE */}
            {activeTab === 'catalog' && (
              <div className="space-y-4">
                <div className="flex justify-between items-center pb-3 border-b border-purple-950/80">
                  <h2 className="text-xl font-bold text-white flex items-center gap-2">
                    <Icon name="shoppingBag" className="text-purple-400" /> Catálogo de Servicios y Productos
                  </h2>
                </div>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                  {services.map(s => (
                    <div key={s.id} className="p-4 bg-[#080214] border border-purple-950/80 rounded-2xl space-y-2">
                      <div className="flex justify-between items-center">
                        <span className="text-xs font-bold text-white">{s.name}</span>
                        <span className="font-mono text-purple-400 font-bold">${s.price} MXN</span>
                      </div>
                      <p className="text-[11px] text-purple-300/70">{s.description}</p>
                      <span className="inline-block px-2 py-0.5 bg-purple-950 text-purple-300 text-[9px] rounded font-mono">{s.itemType}</span>
                    </div>
                  ))}
                </div>
              </div>
            )}

          </main>

          {/* EMAIL LOGIN MODAL */}
          {showLoginModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <form onSubmit={handleLoginByEmail} className="bg-[#080214] border border-purple-900/80 rounded-2xl p-5 max-w-sm w-full space-y-3">
                <h3 className="font-bold text-white text-sm">Entrar con Correo Electrónico</h3>
                <p className="text-xs text-purple-300/70">Ingresa tu correo registrado para validar tu rol de acceso.</p>
                <input type="email" placeholder="ejemplo@foreverwhite.mx" value={loginEmailInput} onChange={e => setLoginEmailInput(e.target.value)} required className="w-full bg-[#03000a] border border-purple-900/60 rounded-xl p-2 text-xs text-white" />
                <div className="flex justify-end gap-2 pt-2">
                  <button type="button" onClick={() => setShowLoginModal(false)} className="px-3 py-1 bg-purple-950 text-xs text-purple-300 rounded-xl">Cancelar</button>
                  <button type="submit" className="px-3 py-1 bg-purple-600 text-white font-bold text-xs rounded-xl">Iniciar Sesión</button>
                </div>
              </form>
            </div>
          )}

          {/* REGISTER SUCURSAL MODAL */}
          {showAddBranchModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <form onSubmit={handleSaveBranch} className="bg-[#080214] border border-purple-900/80 rounded-2xl p-5 max-w-sm w-full space-y-3">
                <h3 className="font-bold text-white text-sm flex items-center gap-1.5">
                  <Icon name="store" className="text-purple-400" /> Registrar Nueva Sucursal
                </h3>
                <div>
                  <label className="text-[10px] text-purple-300/80 font-bold block mb-1">Nombre de Sucursal *</label>
                  <input type="text" placeholder="Ej. Forever White - Coyoacán" value={newBranch.name} onChange={e => setNewBranch({ ...newBranch, name: e.target.value })} required className="w-full bg-[#03000a] border border-purple-900/60 rounded-xl p-2 text-xs text-white" />
                </div>
                <div>
                  <label className="text-[10px] text-purple-300/80 font-bold block mb-1">Dirección Completa *</label>
                  <input type="text" placeholder="Ej. Av. Hidalgo 45, Coyoacán, CDMX" value={newBranch.address} onChange={e => setNewBranch({ ...newBranch, address: e.target.value })} required className="w-full bg-[#03000a] border border-purple-900/60 rounded-xl p-2 text-xs text-white" />
                </div>
                <div>
                  <label className="text-[10px] text-purple-300/80 font-bold block mb-1">Teléfono de Atención</label>
                  <input type="tel" placeholder="Ej. 55 1122 3344" value={newBranch.phone} onChange={e => setNewBranch({ ...newBranch, phone: e.target.value })} className="w-full bg-[#03000a] border border-purple-900/60 rounded-xl p-2 text-xs text-white" />
                </div>
                <div>
                  <label className="text-[10px] text-purple-300/80 font-bold block mb-1">Encargado / Manager</label>
                  <input type="text" placeholder="Ej. Roberto G." value={newBranch.manager} onChange={e => setNewBranch({ ...newBranch, manager: e.target.value })} className="w-full bg-[#03000a] border border-purple-900/60 rounded-xl p-2 text-xs text-white" />
                </div>
                <div className="flex justify-end gap-2 pt-2">
                  <button type="button" onClick={() => setShowAddBranchModal(false)} className="px-3 py-1 bg-purple-950 text-xs text-purple-300 rounded-xl">Cancelar</button>
                  <button type="submit" className="px-3 py-1 bg-purple-600 text-white font-bold text-xs rounded-xl">Guardar Sucursal</button>
                </div>
              </form>
            </div>
          )}

          {/* REGISTER CUSTOMER MODAL */}
          {showAddCustomerModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-[#080214] border border-purple-900/80 rounded-2xl p-5 max-w-sm w-full space-y-3">
                <h3 className="font-bold text-white text-sm">Nuevo Cliente</h3>
                <input type="text" placeholder="Nombre Completo" value={newCustomer.name} onChange={e => setNewCustomer({ ...newCustomer, name: e.target.value })} className="w-full bg-[#03000a] border border-purple-900/60 rounded-xl p-2 text-xs text-white" />
                <input type="tel" placeholder="Teléfono" value={newCustomer.phone} onChange={e => setNewCustomer({ ...newCustomer, phone: e.target.value })} className="w-full bg-[#03000a] border border-purple-900/60 rounded-xl p-2 text-xs text-white" />
                <label className="text-[10px] text-purple-300/80 font-bold block">¿Cómo supo de nosotros?</label>
                <select value={newCustomer.channel} onChange={e => setNewCustomer({ ...newCustomer, channel: e.target.value })} className="w-full bg-[#03000a] border border-purple-900/60 rounded-xl p-2 text-xs text-white">
                  {ACQUISITION_CHANNELS.map(ch => <option key={ch} value={ch}>{ch}</option>)}
                </select>
                <div className="flex justify-end gap-2 pt-2">
                  <button onClick={() => setShowAddCustomerModal(false)} className="px-3 py-1 bg-purple-950 text-xs text-purple-300 rounded-xl">Cancelar</button>
                  <button onClick={handleSaveCustomer} className="px-3 py-1 bg-purple-600 text-white font-bold text-xs rounded-xl">Guardar</button>
                </div>
              </div>
            </div>
          )}

          {/* REGISTER TEAM USER MODAL */}
          {showAddUserModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <form onSubmit={handleSaveUser} className="bg-[#080214] border border-purple-900/80 rounded-2xl p-5 max-w-sm w-full space-y-3">
                <h3 className="font-bold text-white text-sm">Registrar Nuevo Usuario por Correo</h3>
                <input type="text" placeholder="Nombre Completo" value={newUser.name} onChange={e => setNewUser({ ...newUser, name: e.target.value })} required className="w-full bg-[#03000a] border border-purple-900/60 rounded-xl p-2 text-xs text-white" />
                <input type="email" placeholder="correo@foreverwhite.mx" value={newUser.email} onChange={e => setNewUser({ ...newUser, email: e.target.value })} required className="w-full bg-[#03000a] border border-purple-900/60 rounded-xl p-2 text-xs text-white" />
                <label className="text-[10px] text-purple-300/80 font-bold block">Rol de Acceso</label>
                <select value={newUser.role} onChange={e => setNewUser({ ...newUser, role: e.target.value })} className="w-full bg-[#03000a] border border-purple-900/60 rounded-xl p-2 text-xs text-white">
                  <option value="admin">Administrador (Acceso Total)</option>
                  <option value="cashier">Cajero / Operador (POS y 1-Impresión)</option>
                  <option value="technician">Técnico / Lavador</option>
                </select>
                <div className="flex justify-end gap-2 pt-2">
                  <button type="button" onClick={() => setShowAddUserModal(false)} className="px-3 py-1 bg-purple-950 text-xs text-purple-300 rounded-xl">Cancelar</button>
                  <button type="submit" className="px-3 py-1 bg-purple-600 text-white font-bold text-xs rounded-xl">Guardar</button>
                </div>
              </form>
            </div>
          )}

          {/* HIDDEN PRINTABLE THERMAL RECEIPT AREA */}
          <div id="printable-thermal-area" className="hidden">
            <div className="text-center font-mono">
              <h1 className="text-base font-black">FOREVER WHITE.MX</h1>
              <p className="text-[10px]">RECIBO DE ATENCIÓN</p>
              <hr className="my-2 border-dashed border-black" />
            </div>
          </div>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
